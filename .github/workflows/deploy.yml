name: Deploy docs to GitHub Pages and CDN

on:
  push:
    # branches: ["main"]
    branches: ["docs-versioning"]
  workflow_dispatch:

# Minimum permissions required to deploy Pages through GitHub Actions
permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; do not cancel a deployment in progress
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: guidelines/package-lock.json

      - name: Install dependencies
        working-directory: ./guidelines
        run: npm ci

      # --- Build #1: for GitHub Pages (base path = /namirial-design-system) ---
      - name: Build site (Pages)
        working-directory: ./guidelines
        env:
          # basePath detected automatically by GitHub Pages (e.g. "/namirial-design-system").
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Inspect built site (Pages)
        working-directory: ./guidelines
        run: |
          ls -la out || { echo "ERRORE: ./out non esiste — verifica output:'export' in next.config.mjs"; exit 1; }
          if [ -f out/index.html ]; then
            echo "OK: out/index.html (home) presente"
          else
            echo "ERRORE: out/index.html mancante"; find out -maxdepth 2 -type f; exit 1
          fi

      # - name: Upload Pages artifact
      #   uses: actions/upload-pages-artifact@v3
      #   with:
      #     path: ./guidelines/out

      # --- Build #2: for the CDN (EMPTY base path — site served at the domain root) ---
      # The CDN serves at https://xflow.namirial.com/ (root), so the assets/links
      # must NOT carry the /namirial-design-system prefix. We rebuild with an empty
      # base path into a separate folder (out-cdn) and sync THAT to S3. The Pages
      # build above is untouched.
      - name: Build site (CDN)
        working-directory: ./guidelines
        env:
          NEXT_PUBLIC_BASE_PATH: ""
        run: |
          npm run build
          rm -rf out-cdn
          mv out out-cdn

      - name: Inspect built site (CDN)
        working-directory: ./guidelines
        run: |
          test -f out-cdn/index.html || { echo "ERROR: out-cdn/index.html missing"; exit 1; }
          echo "OK: out-cdn/index.html present"

      # --- Deploy the CDN build to S3 + invalidate CloudFront ---
      - name: Configure AWS credentials (OIDC — no keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::034327894611:role/nds-cdn-us-va1-github-deploy
          aws-region: us-east-1

      - name: Upload the built site to S3
        run: aws s3 sync ./guidelines/out-cdn s3://nds-cdn-us-va1-site --delete

      - name: Invalidate the CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E3K6FP044UMV61 \
            --paths '/*'

