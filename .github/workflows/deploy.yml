name: Deploy docs to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: guidelines/package-lock.json

      - name: Install dependencies
        working-directory: ./guidelines
        run: npm ci

      - name: Build site
        working-directory: ./guidelines
        run: npm run build

      - name: Inspect built site
        working-directory: ./guidelines
        run: |
          echo "CWD: $(pwd)"
          echo "Listing ./out"
          ls -la out || (echo "ERROR: ./out does not exist — adjust build output path" && exit 1)
          echo "--- Top-level files ---"
          ls -la out | sed -n '1,200p'
          echo "--- Find index.html ---"
          if [ -f out/index.html ]; then
            echo "index.html found, head:"
            head -n 20 out/index.html
          else
            echo "ERROR: out/index.html not found"
            echo "Contents of out (tree):"
            find out -maxdepth 3 -type f -print
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./guidelines/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
