name: Deploy docs to GitHub Pages

on:
  push:
    # branches: ["main"]
    branches: ["docs-versioning"]
  workflow_dispatch:

# Minimum permissions required to deploy Pages through GitHub Actions
permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; do not cancel a deployment in progress
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: guidelines/package-lock.json

      - name: Install dependencies
        working-directory: ./guidelines
        run: npm ci

      - name: Build site
        working-directory: ./guidelines
        env:
          # basePath detected automatically by GitHub Pages (e.g. "/namirial-design-system").
          # Not set locally → stays "" and does not break `npm run dev`.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Inspect built site
        working-directory: ./guidelines
        run: |
          ls -la out || { echo "ERRORE: ./out non esiste — verifica output:'export' in next.config.mjs"; exit 1; }
          if [ -f out/index.html ]; then
            echo "OK: out/index.html (home) presente"
          else
            echo "ERRORE: out/index.html mancante"; find out -maxdepth 2 -type f; exit 1
          fi

      # - name: Upload Pages artifact
      #   uses: actions/upload-pages-artifact@v3
      #   with:
      #     path: ./guidelines/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      # - name: Deploy to GitHub Pages
      #   id: deployment
      #   uses: actions/deploy-pages@v4     

      # Deploy to AWS
      - name: Configure AWS credentials (OIDC — no keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::034327894611:role/nds-cdn-us-va1-github-deploy
          aws-region: us-east-1

      - name: Upload the built site to S3
        run: aws s3 sync ./guidelines/out s3://nds-cdn-us-va1-site --delete

      - name: Invalidate the CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E3K6FP044UMV61 \
            --paths '/*'
