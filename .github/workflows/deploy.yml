name: Deploy docs to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Permessi minimi richiesti dal deploy Pages tramite GitHub Actions
permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy Pages alla volta; non annulla un deploy in corso
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: guidelines/package-lock.json

      - name: Install dependencies
        working-directory: ./guidelines
        run: npm ci

      - name: Build site
        working-directory: ./guidelines
        env:
          # basePath rilevato automaticamente da GitHub Pages (es. "/namirial-design-system").
          # In locale non è settato → resta "" e non rompe `npm run dev`.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Inspect built site
        working-directory: ./guidelines
        run: |
          ls -la out || { echo "ERRORE: ./out non esiste — verifica output:'export' in next.config.mjs"; exit 1; }
          if [ -f out/index.html ]; then
            echo "OK: out/index.html (home) presente"
          else
            echo "ERRORE: out/index.html mancante"; find out -maxdepth 2 -type f; exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./guidelines/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
